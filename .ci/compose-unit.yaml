services:
  tests:
    build:
      context: .
      dockerfile: unit.Dockerfile
    working_dir: /go/src/github.com/peterstace/simplefeatures
    entrypoint: >-
      go test -covermode=count -coverpkg=./... -coverprofile=coverage.out -test.count=1 -test.run=.
      ./carto
      ./geom
      ./internal/jts/...
      ./internal/jtsport/...
      ./rtree
    volumes:
      - ..:/go/src/github.com/peterstace/simplefeatures
    environment:
      - GO111MODULE=on
